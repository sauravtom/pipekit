---
extends: default

rules:
  # Compose files conventionally omit the document start marker.
  document-start: disable
  # The pinned upstream git URL and the healthcheck one-liners do not wrap.
  line-length:
    max: 140
  comments:
    min-spaces-from-content: 1
  # GitHub Actions uses `on:` as a key, which YAML 1.1 reads as a boolean.
  truthy:
    check-keys: false

ignore: |
  cache/
  .venv/
