name: lint

on:
  push:
    branches: [main]
    paths:
      - 'docker-compose*.yml'
      - '.env.example'
      - '.yamllint.yml'
      - 'scripts/lint-compose.sh'
      - '.github/workflows/lint.yml'
  pull_request:
    paths:
      - 'docker-compose*.yml'
      - '.env.example'
      - '.yamllint.yml'
      - 'scripts/lint-compose.sh'
      - '.github/workflows/lint.yml'
  workflow_dispatch:

jobs:
  compose:
    name: compose files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: pipx install yamllint

      - name: Show toolchain
        run: |
          docker compose version
          yamllint --version

      # Validates YAML style, the compose schema for both the base file and the
      # raw-PCM override, that every ${VAR} has a default, and that .env.example
      # documents them all. Same script as `make lint`.
      - name: Lint compose files
        run: ./scripts/lint-compose.sh
