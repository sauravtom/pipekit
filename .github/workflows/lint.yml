name: lint

on:
  push:
    branches: [main]
    paths:
      - 'docker-compose*.yml'
      - 'Dockerfile.cpu'
      - '.env.example'
      - '.yamllint.yml'
      - 'scripts/lint-compose.sh'
      - '.github/workflows/lint.yml'
  pull_request:
    paths:
      - 'docker-compose*.yml'
      - 'Dockerfile.cpu'
      - '.env.example'
      - '.yamllint.yml'
      - 'scripts/lint-compose.sh'
      - '.github/workflows/lint.yml'
  workflow_dispatch:

jobs:
  compose:
    name: compose files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: pipx install yamllint

      - name: Show toolchain
        run: |
          docker compose version
          yamllint --version

      # Validates YAML style, the compose schema for the base file and every
      # override combination, that every ${VAR} has a default, that
      # .env.example documents them all, and that the CPU profile really does
      # drop the GPU reservation. Same script as `make lint`.
      - name: Lint compose files
        run: ./scripts/lint-compose.sh

  cpu-image:
    name: cpu image builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The CPU profile exists so PipeKit runs without a GPU, and its image is
      # hand-rolled rather than inherited from upstream — so prove it builds.
      # The build ends with `speech-to-speech --help`, which fails the job if
      # the CPU dependency set does not actually import.
      - name: Build CPU image
        run: docker build -f Dockerfile.cpu -t pipekit-cpu:ci .

      - name: Report image size
        run: docker image ls pipekit-cpu:ci --format '{{.Repository}}:{{.Tag}} {{.Size}}'
